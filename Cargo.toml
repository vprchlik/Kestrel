[package]
name = "whimbrel"
version = "0.1.0"
edition = "2021"

[features]
# Build with `--features panic-selftest` (or `just panic`) to panic in kmain
# instead of shutting down. Keeps the panic handler reachable without edits.
panic-selftest = []
# Park after hello with no marker and no panic — exercises TEST HANG.
hang-selftest = []
# Allocator storm after the M1 markers (just test-stress).
stress = []
# Boot through HEAP OK, then alloc frames until the free list is empty.
frame-exhaust-selftest = []
# T2.7/T2.8: write a kernel address; task is killed (D-0034).
userptr-kernel-selftest = []
# T2.7/T2.8: write a pointer that starts valid and runs past its interval.
userptr-span-selftest = []

[dependencies]

# Bare metal has no unwinder; abort turns panics into a plain call to our
# #[panic_handler] and drops the eh_personality requirement.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
