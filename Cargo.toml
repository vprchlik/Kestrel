[package]
name = "whimbrel"
version = "0.1.0"
edition = "2021"

[features]
# Images that never `sret` into U-mode. Selftests that stop in kmain
# enable this so `trap::resume` / `task::enter` are compiled out instead
# of growing a five-feature `allow(dead_code)` list in the Rust source.
# A new kmain-only selftest adds `["no-sret"]` here; it does not edit
# trap.rs.
no-sret = []
# Build with `--features panic-selftest` (or `just panic`) to panic in kmain
# instead of shutting down. Keeps the panic handler reachable without edits.
panic-selftest = ["no-sret"]
# Park after hello with no marker and no panic — exercises TEST HANG.
hang-selftest = ["no-sret"]
# Allocator storm after the M1 markers (just test-stress).
stress = ["no-sret"]
# Boot through HEAP OK, then alloc frames until the free list is empty.
frame-exhaust-selftest = ["no-sret"]
# T2.7/T2.8: write a kernel address; task is killed (D-0034).
userptr-kernel-selftest = []
# T2.7/T2.8: write a pointer that starts valid and runs past its interval.
userptr-span-selftest = []
# T2.10: U-mode load page fault; the other task continues (D-0034).
user-fault-selftest = []
# T2.11: freeze, then a deliberate alloc_frame that must panic.
freeze-selftest = ["no-sret"]
# T3.3: handshake to DRIVER_OK, then stop before U-mode.
net-init-selftest = ["no-sret"]
# T3.9: UDP echo in the app over recv/send. Enters U-mode (D-0051).
net-udp-selftest = []
# Build-only: plant a `c.fld` in `.utext` so check-utext can fail by name
# (D-0044). Not a boot image.
utext-c-fld-selftest = []

[workspace]
members = [".", "usys", "app"]
resolver = "2"

[dependencies]
app = { path = "app" }

# Bare metal has no unwinder; abort turns panics into a plain call to our
# #[panic_handler] and drops the eh_personality requirement.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# D-0051: the app/usys packages must not emit bounds-check / overflow
# panics (those `jal` into kernel `core::panicking`) or `memcpy` calls
# (those resolve to `compiler_builtins` in kernel `.text`). opt-level 1
# inlines small copies; overflow/debug assertions off removes the
# panicking inserts. panic=abort is inherited from profile.dev.
[profile.dev.package.app]
opt-level = 1
overflow-checks = false
debug-assertions = false

[profile.dev.package.usys]
opt-level = 1
overflow-checks = false
debug-assertions = false
